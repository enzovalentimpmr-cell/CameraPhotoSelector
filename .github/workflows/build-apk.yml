name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: ["principal"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Descompactar projeto
        run: |
          mkdir projeto
          unzip -q CameraPhotoSelector_GitHubActions.zip -d projeto

     - name: Compilar APK
  run: |
    cd projeto
    find . -name settings.gradle -o -name settings.gradle.kts
    gradle assembleDebug --no-daemon
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CameraPhotoSelector-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk